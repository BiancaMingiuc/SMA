# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# NOTE: keep -Xmx modest on a low-RAM machine. Asking for more heap than the
# machine can spare forces disk swapping and makes builds SLOWER, not faster.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Run independent modules/tasks in parallel.
org.gradle.parallel=true
# Only configure the tasks a given build actually needs.
org.gradle.configureondemand=true
# Reuse outputs from previous builds (local task-output cache). Biggest win for
# "it rebuilds everything every time".
org.gradle.caching=true
# Keep the daemon alive between builds so the JVM stays warm.
org.gradle.daemon=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Incremental Kotlin compilation — only recompile changed files.
kotlin.incremental=true
# Only generate R classes for the modules that need them (faster, smaller).
android.nonTransitiveRClass=true